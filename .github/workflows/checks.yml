name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # Windows is what kota runs on, and the only runner with DPAPI. Linux
        # is here to keep the parts that are not Windows-only honest: the
        # secrets backend falls back, and the tests must still pass.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 ruff

      # PyQt6 links against libEGL even on the offscreen platform, and the
      # Ubuntu runners do not ship it. Without this Qt fails to load, the GUI
      # tests quietly skip themselves, and the screenshot step fails outright.
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Lint
        run: ruff check .

      - name: Tests
        # No screen on a runner, so Qt draws to the offscreen platform. It
        # still needs the libraries installed above to load at all.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: The pictures still draw
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/screenshot.py ${{ runner.temp }}/shots
